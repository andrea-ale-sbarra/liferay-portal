components:
    parameters:
        shipmentIdPathParam:
            in: "path"
            explode: false
            name: "shipmentId"
            required: true
            schema:
                description:
                    "The shipment resource Id"
                example: 30130
                format: "int64"
                minimum: 0
                type: "integer"
            style: "simple"
        shipmentItemIdPathParam:
            in: "path"
            explode: false
            name: "shipmentItemId"
            required: true
            schema:
                description:
                    "The shipment resource Id"
                example: 30130
                format: "int64"
                minimum: 0
                type: "integer"
            style: "simple"
    schemas:
        Error:
            properties:
                errorCode:
                    description:
                        "Internal error code mapping"
                    example: 996
                    readOnly: true
                    type: "integer"
                errorDescription:
                    example: "Unable to find currency. Currency code should be expressed with\
                        \ 3-letter ISO 4217 format."
                    readOnly: true
                    type: "string"
                message:
                    example: "No CommerceCurrency exists with the key {groupId=41811, code=US\
                        \ Dollar}"
                    readOnly: true
                    type: "string"
                status:
                    description:
                        "HTTP Status code"
                    example: 404
                    readOnly: true
                    type: "integer"
            required:
                - "errorCode"
                - "errorDescription"
                - "message"
                - "status"
            type: "object"
        Shipment:
            properties:
                accountId:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                addressId:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                carrier:
                    example: "FedEx"
                    type: string
                createDate:
                    format: date
                    readOnly: true
                    type: string
                expectedDate:
                    format: date
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                modifiedDate:
                    format: date
                    readOnly: true
                    type: string
                orderId:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                shipmentItems:
                    items:
                        $ref: "#/components/schemas/ShipmentItem"
                    type: array
                shippingDate:
                    format: date
                    type: string
                shippingMethodId:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                shippingOptionName:
                    example: "FedEx"
                    readOnly: true
                    type: string
                status:
                    allOf:
                        - $ref: "#/components/schemas/Status"
                    readOnly: true
                trackingNumber:
                    example: "123AD-asd"
                    type: string
                userName:
                    example: "John"
                    readOnly: true
                    type: string
            required:
                - "orderId"
            type: "object"
        ShipmentItem:
            properties:
                createDate:
                    format: date
                    readOnly: true
                    type: string
                id:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                modifiedDate:
                    format: date
                    readOnly: true
                    type: string
                orderItemId:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                quantity:
                    example: 1
                    format: int32
                    minimum: 0
                    type: integer
                shipmentId:
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                userName:
                    example: "John"
                    readOnly: true
                    type: string
                warehouseId:
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
            required:
                - "orderItemid"
                - "quantity"
                - "warehouseId"
            type: "object"
        Status:
            properties:
                code:
                    format: "int32"
                    readOnly: true
                    type: "integer"
                label:
                    example: "black"
                    type: "string"
                label_i18n:
                    example: "black"
                    type: "string"
            type: "object"
    securitySchemes:
        BasicAuth:
            scheme: "basic"
            type: "http"
        BearerAuth:
            scheme: "bearer"
            type: "http"
        OAuth2:
            flows:
                authorizationCode:
                    authorizationUrl: "/oauth/authorize"
                    scopes:
                        CommerceOpenApiAdmin.admin: "Grants access to admin operations"
                        CommerceOpenApiAdmin.read: "Grants read access"
                        CommerceOpenApiAdmin.write: "Grants write access"
                    tokenUrl: "/oauth/token"
            type: "oauth2"
