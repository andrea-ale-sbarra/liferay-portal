query UserSession($channelId: String, $entityType: EntityType!, $keywords: String, $page: Int!, $rangeEnd: String, $rangeKey: Int, $rangeStart: String, $size: Int!) { eventsByUserSessions(channelId: $channelId, entityType: $entityType, keywords: $keywords, page: $page, rangeEnd: $rangeEnd, rangeKey: $rangeKey, rangeStart: $rangeStart, size: $size) { userSessions { ... on UserSession { events { createDate emailAddressHashed name } } } totalEvents } }