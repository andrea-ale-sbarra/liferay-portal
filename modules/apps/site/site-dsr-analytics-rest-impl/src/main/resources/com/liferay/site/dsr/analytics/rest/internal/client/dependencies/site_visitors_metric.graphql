query SitesMetricQuery($channelId: String, $interval: String!, $rangeEnd: String, $rangeKey: Int, $rangeStart: String) { site(channelId: $channelId, interval: $interval, rangeEnd: $rangeEnd, rangeKey: $rangeKey, rangeStart: $rangeStart) { visitorsMetric { histogram { asymmetricComparison metrics { key value valueKey } total } } } }