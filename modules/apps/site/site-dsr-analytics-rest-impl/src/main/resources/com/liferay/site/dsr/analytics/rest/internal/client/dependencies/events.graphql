query EventQuery($channelId: String, $includeAnonymousUsers: Boolean, $individualId: String, $keywords: String, $page: Int!, $rangeEnd: String, $rangeKey: Int, $rangeStart: String, $size: Int!) { events(channelId: $channelId, includeAnonymousUsers: $includeAnonymousUsers, individualId: $individualId, keywords: $keywords, page: $page, rangeEnd: $rangeEnd, rangeKey: $rangeKey, rangeStart: $rangeStart, size: $size) { events { emailAddressHashed name createDate } } }