query SitesMetricQuery($channelId: String, $emailAddresses: [String], $interval: String!, $rangeEnd: String, $rangeKey: Int, $rangeStart: String) { site(channelId: $channelId, emailAddresses: $emailAddresses, interval: $interval, rangeEnd: $rangeEnd, rangeKey: $rangeKey, rangeStart: $rangeStart) { sessionsMetric { histogram { asymmetricComparison metrics { key value valueKey } total } } } }