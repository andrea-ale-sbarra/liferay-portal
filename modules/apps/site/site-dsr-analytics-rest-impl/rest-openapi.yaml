components:
    schemas:
        DocumentMetric:
            properties:
                assetId:
                    type: string
                assetTitle:
                    type: string
                commentsMetric:
                    $ref: "#/components/schemas/MetricValue"
                downloadsMetric:
                    $ref: "#/components/schemas/MetricValue"
                impressionMadeMetric:
                    $ref: "#/components/schemas/MetricValue"
                lastViewedMetric:
                    $ref: "#/components/schemas/MetricValue"
                ratingsMetric:
                    $ref: "#/components/schemas/MetricValue"
                urls:
                    items:
                        type: string
                    type: array
                usersInvolvedMetric:
                    $ref: "#/components/schemas/MetricValue"
        DocumentMetricsPage:
            properties:
                documentMetrics:
                    items:
                        $ref: "#/components/schemas/DocumentMetric"
                    type: array
                total:
                    format: int64
                    type: integer
        EventEntry:
            properties:
                createDate:
                    type: string
                emailAddressHashed:
                    type: string
                name:
                    type: string
        EventsPage:
            properties:
                eventEntries:
                    items:
                        $ref: "#/components/schemas/EventEntry"
                    type: array
        Histogram:
            properties:
                asymmetricComparison:
                    format: double
                    type: number
                histogramMetrics:
                    items:
                        $ref: "#/components/schemas/HistogramMetric"
                    type: array
                total:
                    format: double
                    type: number
        HistogramMetric:
            properties:
                key:
                    type: string
                value:
                    format: double
                    type: number
                valueKey:
                    type: string
        MetricValue:
            properties:
                value:
                    format: double
                    type: number
        MostActiveVisitor:
            properties:
                activitiesCount:
                    format: int64
                    type: integer
                emailAddress:
                    type: string
                firstName:
                    type: string
                id:
                    type: string
                lastName:
                    type: string
        MostActiveVisitorsPage:
            properties:
                total:
                    format: int64
                    type: integer
                mostActiveVisitors:
                    items:
                        $ref: "#/components/schemas/MostActiveVisitor"
                    type: array
        SiteHistogramMetric:
            properties:
                histogram:
                    $ref: "#/components/schemas/Histogram"
        UserSession:
            properties:
                userSessionEvents:
                    items:
                        $ref: "#/components/schemas/UserSessionEvent"
                    type: array
        UserSessionEvent:
            properties:
                createDate:
                    type: string
                emailAddressHashed:
                    type: string
                name:
                    type: string
        UserSessionsPage:
            properties:
                totalEvents:
                    format: int64
                    type: integer
                userSessions:
                    items:
                        $ref: "#/components/schemas/UserSession"
                    type: array
        VisitFrequency:
            properties:
                visitFrequencyItems:
                    items:
                        $ref: "#/components/schemas/VisitFrequencyItem"
                    type: array
                totalCount:
                    format: int64
                    type: integer
        VisitFrequencyItem:
            properties:
                count:
                    format: int64
                    type: integer
                name:
                    type: string
info:
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/documents":
        get:
            operationId: getDocument
            parameters:
                -   in: query
                    name: channelId
                    schema:
                        type: string
                -   in: query
                    name: keywords
                    schema:
                        type: string
                -   in: query
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    name: rangeKey
                    schema:
                        type: integer
                -   in: query
                    name: rangeStart
                    schema:
                        type: string
                -   in: query
                    name: size
                    required: true
                    schema:
                        type: integer
                -   in: query
                    name: sortColumn
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: sortType
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: start
                    required: true
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DocumentMetricsPage"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/DocumentMetricsPage"
            tags: ["DocumentMetric"]
    "/events":
        get:
            parameters:
                -   in: query
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: includeAnonymousUsers
                    schema:
                        type: boolean
                -   in: query
                    name: individualId
                    schema:
                        type: string
                -   in: query
                    name: keywords
                    schema:
                        type: string
                -   in: query
                    name: page
                    required: true
                    schema:
                        type: integer
                -   in: query
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    name: rangeKey
                    schema:
                        type: integer
                -   in: query
                    name: rangeStart
                    schema:
                        type: string
                -   in: query
                    name: size
                    required: true
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/EventsPage"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/EventsPage"
            tags: ["Event"]
    "/events-by-user-sessions":
        get:
            operationId: getEventsByUserSession
            parameters:
                -   in: query
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: entityType
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: keywords
                    schema:
                        type: string
                -   in: query
                    name: page
                    required: true
                    schema:
                        type: integer
                -   in: query
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    name: rangeKey
                    schema:
                        type: integer
                -   in: query
                    name: rangeStart
                    schema:
                        type: string
                -   in: query
                    name: size
                    required: true
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserSessionsPage"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/UserSessionsPage"
            tags: ["UserSession"]
    "/most-active-visitors":
        get:
            operationId: getMostActiveVisitor
            parameters:
                -   in: query
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: rangeKey
                    schema:
                        type: integer
                -   in: query
                    name: size
                    required: true
                    schema:
                        type: integer
                -   in: query
                    name: start
                    required: true
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MostActiveVisitorsPage"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/MostActiveVisitorsPage"
            tags: ["MostActiveVisitor"]
    "/site-sessions-metric":
        get:
            parameters:
                -   in: query
                    name: channelId
                    schema:
                        type: string
                -   in: query
                    name: emailAddresses
                    schema:
                        items:
                            type: string
                        type: array
                -   in: query
                    name: interval
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    name: rangeKey
                    schema:
                        type: integer
                -   in: query
                    name: rangeStart
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SiteHistogramMetric"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SiteHistogramMetric"
            tags: ["SiteSessionsMetric"]
    "/site-visitors-metric":
        get:
            parameters:
                -   in: query
                    name: channelId
                    schema:
                        type: string
                -   in: query
                    name: interval
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    name: rangeKey
                    schema:
                        type: integer
                -   in: query
                    name: rangeStart
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SiteHistogramMetric"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SiteHistogramMetric"
            tags: ["SiteVisitorsMetric"]
    "/visit-frequency":
        get:
            operationId: getVisitFrequency
            parameters:
                -   in: query
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: rangeKey
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/VisitFrequency"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/VisitFrequency"
            tags: ["VisitFrequency"]
